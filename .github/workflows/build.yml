name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Estante-0.1.${{ github.run_number }}.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Estante 0.1.${{ github.run_number }}
          body: "Versão ${{ github.run_number }} — commit ${{ github.sha }}"
          files: Estante-0.1.${{ github.run_number }}.apk
