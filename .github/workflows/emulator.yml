name: Teste no emulador

on:
  workflow_dispatch:
    inputs:
      teste:
        description: 'tudo ou botoes'
        default: 'tudo'
      tempo:
        description: 'segundos para o teste de botões'
        default: '2400'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: bash test/run.sh "${{ inputs.teste }}" "${{ inputs.tempo }}"

      - name: Enviar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado
          path: out/
